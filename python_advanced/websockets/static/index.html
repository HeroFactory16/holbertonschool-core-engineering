<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>Chat</h1>

        <form id="chat-form" autocomplete="off">

        </form>
    </main>
    <script src="/static/chat.js"></script>
</body>
</html>
